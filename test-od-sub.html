<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>overdub STUDIO — Abo-Live-Test (intern)</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#0a0a0b; color:#e8e8ec;
         display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
  .box { max-width:460px; text-align:center; padding:32px; }
  h1 { font-size:20px; }
  p { color:#c4c4cd; line-height:1.6; font-size:14px; }
  .warn { color:#c8f060; font-size:12px; margin-top:8px; }
  button { margin-top:24px; background:#c8f060; color:#0a0a0b; border:0; border-radius:8px;
           padding:14px 28px; font-size:15px; font-weight:600; cursor:pointer; }
  code { color:#c8f060; font-size:12px; }
</style>
</head>
<body>
  <div class="box">
    <h1>overdub STUDIO — Abo-Live-Test</h1>
    <p>Interne Test-Seite (nicht verlinkt, noindex). Öffnet den Paddle-Production-
       Checkout für das <strong>Test-Abo 4,99 €/Monat</strong>.</p>
    <p class="warn">⚠️ Echte Zahlung. Danach in Paddle kündigen + erstatten.</p>
    <button id="buy">Test-Abo kaufen (4,99 €/Monat)</button>
    <p style="margin-top:20px;"><code id="status"></code></p>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    // PRODUCTION Paddle (live token) + der temporaere 4,99-Test-Abo-Preis.
    const LIVE_TOKEN = 'live_d396180ae63b7e976090665cccb';
    const TEST_PRICE = 'pri_01kteb6z4rqwjttrqrxxd8befq';
    const s = document.getElementById('status');
    try {
      Paddle.Initialize({ token: LIVE_TOKEN });
      s.textContent = 'Paddle bereit.';
    } catch (e) { s.textContent = 'Paddle-Init-Fehler: ' + e; }

    document.getElementById('buy').addEventListener('click', () => {
      Paddle.Checkout.open({
        items: [{ priceId: TEST_PRICE, quantity: 1 }],
        settings: { theme: 'dark', locale: 'de' },
      });
    });
  </script>
</body>
</html>
