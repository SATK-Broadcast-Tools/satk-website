/* Layout: Hilfe-Handbuch nach dem Muster der Apple-Benutzerhandbuecher.

:root {

}

  padding: 0 12px 0 34px; font: inherit; font-size: 15px;
}

.drop { position: absolute; right: 0; top: 42px; width: min(460px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; max-height: 70vh; overflow: auto; }

.tree ul a { font-size: 14px; color: var(--fg); opacity: .88; }
.tree ul a.cur { opacity: 1; }

/* Lesespalte */
main { min-width: 0; padding: 36px max(24px, env(safe-area-inset-right, 0px)) 80px 56px; }
.page { max-width: 760px; }
.crumb { font-size: 14px; color: var(--muted); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; }

  border: 1.5px dashed var(--line); border-radius: 10px; background: repeating-linear-gradient(135deg, var(--ph-a) 0 10px, var(--ph-b) 10px 20px); }

.topics { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 22px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; border-top: 1px solid var(--line); padding-top: 22px; }

.pager .next { text-align: right; grid-column: 2; }

/* Startseite */
.hero { padding: 6px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 30px; }

.tile .tn { font-size: 13px; color: var(--brand-ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Lupe */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.82); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<header class="top">
  <button class="toc-btn" id="tocBtn" aria-controls="side" aria-expanded="false">Contents</button>
  <a class="brand" href="#start" aria-label="Start page of the guide">

  </a>
  <div class="search" role="search">

</header>
<div class="wrap">
  <nav class="side" id="side" aria-label="Table of contents">

    <ul class="tree" id="tree"></ul>
    <div class="site-links"><a href="/voyzsession-en">voyzSESSION PRO on pegelwerk.com</a><a href="/support-en">Support request</a><div class="langs" aria-label="Language"><a href="/voyzsession-handbuch/" hreflang="de">Deutsch</a> <a href="/voyzsession-handbuch-en/" hreflang="en" class="cur" aria-current="true">English</a> <a href="/fr/voyzsession-handbuch/" hreflang="fr">Français</a> <a href="/es/voyzsession-handbuch/" hreflang="es">Español</a> <a href="/it/voyzsession-handbuch/" hreflang="it">Italiano</a> <a href="/pt/voyzsession-handbuch/" hreflang="pt">Português</a></div></div>
  </nav>

  <main id="main"><div class="page"><p style="color:var(--muted)">Loading the guide...</p></div></main>
</div>

<script>
const L = {"title": "voyzSESSION PRO User Guide", "manual": "User Guide", "toc": "Contents", "toc_long": "Table of contents", "home_aria": "Start page of the guide", "search": "Search the guide", "search_short": "Search", "loading": "Loading the guide...", "load_error": "The content could not be loaded. Please reload the page.", "toggle": "expand or collapse", "paging": "Page navigation", "prev": "Previous", "next": "Next", "chapter": "Chapter", "reference": "Reference", "topics": "topics", "version": "Version 2.0 for macOS", "tagline": "Record, edit and mix voice-over, dubbing, podcasts, audiobooks and radio.", "first_steps": "Getting started", "product": "Product page and download", "support": "Support request", "site_link": "voyzSESSION PRO on pegelwerk.com", "in_chapter": "In this chapter", "overview": "Chapter overview", "show_all": "Show all %n results", "no_hits": "No results for “%q”.", "search_title": "Search: “%q”", "hits": "results", "lang": "Language", "desc": "Online user guide for voyzSESSION PRO 2.0 for macOS: recording, editing, AUTO MIX, Manual mode, sound modules, export and remote recording. With search and table of contents.", "start_links": [["k3-1", "Create and save a project"], ["k3-3", "Set the microphone level"], ["k3-5", "First recording"], ["k7-2", "Start AUTO MIX"], ["k12-1", "Export"]], "product_url": "/voyzsession-en", "support_url": "/support-en"};
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fold = s => s.toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let chapters = [], order = [], byId = {};

  fetch('content.json').then(r => r.json()).then(d => {
    chapters = d.chapters;
    chapters.forEach(c => {
      c.kind = 'chapter'; byId[c.id] = c; order.push(c);
      c.topics.forEach(t => { t.kind = 'topic'; t.ch = c; byId[t.id] = t; order.push(t); });
    });
    buildTree(); route();
  }).catch(() => {
    $('#main').innerHTML = '<div class="page"><p>' + L.load_error + '</p></div>';
  });

  const label = c => (c.num ? c.num + ' ' : '') + c.title;

  function buildTree() {
    const arrow = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l5 4-5 4z"/></svg>';
    $('#tree').innerHTML = chapters.map(c => `
      <li id="li-${c.id}">
        <div class="ch">
          <button class="tw" aria-label="${esc(c.title)}: ${L.toggle}" data-tw="${c.id}">${arrow}</button>
          <a href="#${c.id}" data-id="${c.id}">${c.num ? `<span class="n">${c.num}</span>` : ''}${esc(c.title)}</a>
        </div>
        <ul>${c.topics.map(t => `<li><a href="#${t.id}" data-id="${t.id}">${t.num ? `<span class="n">${esc(t.num)}</span>` : ''}${esc(t.title)}</a></li>`).join('')}</ul>
      </li>`).join('');
    $('#tree').addEventListener('click', e => {
      const b = e.target.closest('[data-tw]');
      if (b) { $('#li-' + b.dataset.tw).classList.toggle('open'); return; }
      if (e.target.closest('a')) closeNav();
    });
  }

  function markTree(id) {
    document.querySelectorAll('#tree a.cur').forEach(a => a.classList.remove('cur'));
    const a = document.querySelector(`#tree a[data-id="${id}"]`);
    if (!a) return;
    a.classList.add('cur');
    const item = byId[id]; const cid = item.kind === 'topic' ? item.ch.id : item.id;
    $('#li-' + cid).classList.add('open');
    const r = a.getBoundingClientRect(), s = $('#side').getBoundingClientRect();
    if (r.top < s.top + 40 || r.bottom > s.bottom - 20) a.scrollIntoView({ block: 'center' });
  }

  function pager(item) {
    const i = order.indexOf(item), p = order[i - 1], n = order[i + 1];
    const link = (x, cls, txt) => x ? `<a class="${cls}" href="#${x.id}"><div class="pl">${txt}</div><div class="pt">${esc(label(x))}</div></a>` : '';
    return `<nav class="pager" aria-label="${L.paging}">${link(p, 'prev', L.prev)}${link(n, 'next', L.next)}</nav>`;
  }

  function crumb(item) {
    const parts = [`<a href="#start">${L.manual}</a>`];
    if (item.kind === 'topic') parts.push(`<a href="#${item.ch.id}">${esc(label(item.ch))}</a>`);
    return `<div class="crumb">${parts.join('<span class="sep">›</span>')}</div>`;
  }

  function renderHome() {
    const tiles = chapters.filter(c => c.id !== 'k0').map(c => `
      <a class="tile" href="#${c.id}"><span class="tn">${c.num ? L.chapter + ' ' + c.num : L.reference}</span>
      <span class="tt">${esc(c.title)}</span><span class="tc">${c.topics.length} ${L.topics}</span></a>`).join('');
    const about = byId.k0 ? `<a href="#k0">${esc(byId.k0.title)}</a> &nbsp;|&nbsp; ` : '';
    return `<div class="page">
      <section class="hero"><div class="eyebrow">${L.version}</div>
        <h1>${L.title}</h1>
        <p>${L.tagline}</p></section>
      <div class="grid">${tiles}</div>
      <section class="start"><h2>${L.first_steps}</h2><ol>${L.start_links.map(([id, t]) => `<li><a href="#${id}">${esc(t)}</a></li>`).join('')}</ol>
        <p style="margin-top:18px">${about}<a href="${L.product_url}">${L.product}</a> &nbsp;|&nbsp; <a href="${L.support_url}">${L.support}</a></p></section>
    </div>`;
  }

  function renderChapter(c) {
    const list = c.topics.length ? `<section class="topics"><h2>${L.in_chapter}</h2><ul>${c.topics.map(t =>
      `<li><a href="#${t.id}"><span class="n">${esc(t.num)}</span><span>${esc(t.title)}</span></a></li>`).join('')}</ul></section>` : '';
    return `<article class="page">${crumb(c)}<h1>${c.num ? `<span class="num">${c.num}</span>` : ''}${esc(c.title)}</h1>
      <div class="content">${c.intro}</div>${list}${pager(c)}</article>`;
  }

  function renderTopic(t) {
    return `<article class="page">${crumb(t)}<h1>${t.num ? `<span class="num">${esc(t.num)}</span>` : ''}${esc(t.title)}</h1>
      <div class="content">${t.html}</div>${pager(t)}</article>`;
  }

  let pendingHighlight = null;
  function route() {
    if (!chapters.length) return;
    const id = location.hash.slice(1);
    const item = byId[id];
    const main = $('#main');
    if (!item) { main.innerHTML = renderHome(); markTree(''); document.title = L.title; }
    else {
      main.innerHTML = item.kind === 'chapter' ? renderChapter(item) : renderTopic(item);
      markTree(id);
      document.title = item.title + ' - ' + L.title;
    }
    window.scrollTo(0, 0);
    if (pendingHighlight) { highlight(main.querySelector('.content'), pendingHighlight); pendingHighlight = null; }
  }
  window.addEventListener('hashchange', route);

  // Suche
  const isStart = (f, i) => i === 0 || !/[a-z0-9]/.test(f[i - 1]);
  const count = (f, w, anywhere) => { let n = 0, i = f.indexOf(w); while (i >= 0) { if (anywhere || isStart(f, i)) n++; i = f.indexOf(w, i + 1); } return n; };
  function search(q) {
    const r = searchMode(q, false);
    return r.length ? r : searchMode(q, true);
  }
  function searchMode(q, anywhere) {
    const terms = fold(q).split(/\s+/).filter(w => w.length > 1);
    if (!terms.length) return [];
    const res = [];
    for (const it of order) {
      const title = fold(label(it)), text = fold(it.text || ''), chap = it.kind === 'topic' ? fold(it.ch.title) : '';
      let score = 0, ok = true;
      for (const w of terms) {
        const nX = count(text, w, anywhere), inT = count(title, w, anywhere) > 0, inX = nX > 0, inC = count(chap, w, anywhere) > 0;
        if (!inT && !inX && !inC) { ok = false; break; }
        score += (inT ? 12 : 0) + (inX ? 2 + Math.min(4, nX) : 0) + (inC ? 1 : 0);
      }
      if (ok && score) res.push({ it, score });
    }
    return res.sort((a, b) => b.score - a.score);
  }
  function snippet(it, q) {
    const raw = it.text || '', f = fold(raw), w = fold(q).split(/\s+/).filter(x => x.length > 1)[0] || '';
    let i = w ? f.indexOf(w) : 0; if (i < 0) i = 0;
    const s = Math.max(0, i - 50), part = raw.slice(s, s + 170);
    return (s > 0 ? '... ' : '') + hl(esc(part), q) + (s + 170 < raw.length ? ' ...' : '');
  }
  function hl(htmlStr, q) {
    const map = { a: '[a\u00e4\u00e0\u00e1]', o: '[o\u00f6\u00f2\u00f3]', u: '[u\u00fc\u00f9\u00fa]', e: '[e\u00e9\u00e8]', s: '(?:s|\u00df)' };
    const terms = fold(q).split(/\s+/).filter(w => w.length > 1).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[aoues]/g, c => map[c]));
    if (!terms.length) return htmlStr;
    return htmlStr.replace(new RegExp('(^|[^\\p{L}\\p{N}])(' + terms.join('|') + ')', 'giu'), '$1<mark>$2</mark>');
  }
  function where(it) { return it.kind === 'topic' ? label(it.ch) : L.overview; }

  const q = $('#q'), drop = $('#drop');
  if (window.matchMedia('(max-width: 900px)').matches) q.placeholder = L.search_short;
  let sel = -1;
  q.addEventListener('input', () => {
    const v = q.value.trim();
    if (v.length < 2) { drop.hidden = true; return; }
    const r = search(v); sel = -1;
    drop.innerHTML = r.length
      ? r.slice(0, 7).map(x => `<a href="#${x.it.id}" data-hl="1"><div class="rt">${esc(label(x.it))}</div><div class="rc">${esc(where(x.it))}</div><div class="rs">${snippet(x.it, v)}</div></a>`).join('')
        + (r.length > 7 ? `<a href="#" class="all" data-all="1">${L.show_all.replace('%n', r.length)}</a>` : '')
      : `<div class="none">${L.no_hits.replace('%q', esc(v))}</div>`;
    drop.hidden = false;
  });
  q.addEventListener('keydown', e => {
    const items = [...drop.querySelectorAll('a')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length || drop.hidden) return; e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('sel', i === sel));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (sel >= 0 && items[sel] && !items[sel].dataset.all) { pendingHighlight = q.value.trim(); location.hash = items[sel].getAttribute('href').slice(1); closeDrop(); }
      else showResults(q.value.trim());
    } else if (e.key === 'Escape') { closeDrop(); q.blur(); }
  });
  drop.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.all) { e.preventDefault(); showResults(q.value.trim()); return; }
    pendingHighlight = q.value.trim(); closeDrop();
    if (a.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) closeDrop(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
  function closeDrop() { drop.hidden = true; sel = -1; }

  function showResults(v) {
    closeDrop();
    if (v.length < 2) return;
    const r = search(v);
    $('#main').innerHTML = `<div class="page results"><div class="crumb"><a href="#start">${L.manual}</a></div>
      <h1>${L.search_title.replace('%q', esc(v))}</h1><p style="color:var(--muted)">${r.length} ${L.hits}</p>
      ${r.map(x => `<div class="r"><a href="#${x.it.id}" data-hl="1">${esc(label(x.it))}</a><div class="rc">${esc(where(x.it))}</div><div class="rs">${snippet(x.it, v)}</div></div>`).join('')}</div>`;
    markTree('');
    window.scrollTo(0, 0);
    $('#main').querySelectorAll('a[data-hl]').forEach(a => a.addEventListener('click', () => { pendingHighlight = v; }));
  }

  function highlight(root, qv) {
    if (!root) return;
    const terms = fold(qv).split(/\s+/).filter(w => w.length > 1);
    if (!terms.length) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    let first = null;
    for (const n of nodes) {
      const t = n.nodeValue, f = fold(t);
      const hits = [];
      terms.forEach(w => { let i = f.indexOf(w); while (i >= 0) { if (isStart(f, i)) hits.push([i, i + w.length]); i = f.indexOf(w, i + w.length); } });
      if (!hits.length || f.length !== t.length) continue;
      hits.sort((a, b) => a[0] - b[0]);
      const frag = document.createDocumentFragment(); let pos = 0;
      for (const [a, b] of hits) { if (a < pos) continue; frag.append(t.slice(pos, a)); const m = document.createElement('mark'); m.textContent = t.slice(a, b); frag.append(m); first = first || m; pos = b; }
      frag.append(t.slice(pos)); n.replaceWith(frag);
    }
    if (first) window.scrollTo(0, Math.max(0, first.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2));
  }

  // Inhaltsverzeichnis auf schmalen Bildschirmen
  const tocBtn = $('#tocBtn');
  tocBtn.addEventListener('click', () => { const o = document.body.classList.toggle('nav-open'); tocBtn.setAttribute('aria-expanded', o); });
  $('#scrim').addEventListener('click', closeNav);
  function closeNav() { document.body.classList.remove('nav-open'); tocBtn.setAttribute('aria-expanded', 'false'); }

  // Bilder vergroessern
  document.addEventListener('click', e => {
    const img = e.target.closest('figure.fig img');
    if (img) {
      const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = `<img src="${img.getAttribute('src')}" alt="${esc(img.alt)}">`;
      lb.addEventListener('click', () => lb.remove()); document.body.append(lb);
    } else if (e.target.closest('.lb')) e.target.closest('.lb').remove();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.lb').forEach(x => x.remove()); });
})();
</script>
</body>
</html>
